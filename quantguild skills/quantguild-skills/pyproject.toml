[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qglib"
version = "0.1.0"
description = "Computational finance methods from the Quant Guild Library, cleaned up and tested"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
stats = ["statsmodels"]
test = ["pytest"]

[tool.setuptools]
packages = ["qglib"]
